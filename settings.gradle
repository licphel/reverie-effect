rootProject.name = "rf"

// momentum engine: a git submodule at modules/momentum, consumed as a Gradle composite
// build. It is a separate repository — not a regular subproject — so it is
// excluded from the module scans below.
includeBuild("modules/momentum")
includeBuild("modules/launcher")

// Game module at the repository root (Mindustry-style). Tests live in core's
// own test source set, so there is no separate test module.
['core'].each { name ->
  include(name)
  project(":$name").projectDir = file(name)
}

dependencyResolutionManagement {
  versionCatalogs {
    libs {
      library('jspecify', 'org.jspecify', 'jspecify').version('1.0.0')
      library('fastutil', 'it.unimi.dsi', 'fastutil').version('8.5.15')
    }
  }
}
